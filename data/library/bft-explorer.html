<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BFT Explorer — Library Dataset</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #242734;
    --border: #2e3348;
    --text: #e2e4ed;
    --text-dim: #8b8fa3;
    --accent: #6c8cff;
    --alloc: #5b9f5b;
    --elim: #c45c5c;
    --reserve: #7a7a8c;
    --sumsum: #c49b3c;
    --home: #6c8cff;
    --junction: #8b6cc4;
    --correction: rgba(196, 92, 92, 0.12);
    --reserve-row: rgba(122, 122, 140, 0.10);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
    font-size: 13px;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }

  header {
    padding: 24px 32px 16px;
    border-bottom: 1px solid var(--border);
  }

  header h1 {
    font-size: 20px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 4px;
  }

  header p { color: var(--text-dim); font-size: 12px; }

  .steps {
    display: flex;
    gap: 0;
    padding: 0 32px;
    margin-top: 16px;
    border-bottom: 1px solid var(--border);
  }

  .step-tab {
    padding: 10px 20px;
    cursor: pointer;
    color: var(--text-dim);
    border-bottom: 2px solid transparent;
    font-size: 13px;
    font-family: inherit;
    background: none;
    border-top: none;
    border-left: none;
    border-right: none;
    transition: all 0.15s;
  }

  .step-tab:hover { color: var(--text); }

  .step-tab.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }

  .step-tab .num {
    display: inline-block;
    width: 20px;
    height: 20px;
    line-height: 20px;
    text-align: center;
    border-radius: 50%;
    background: var(--surface2);
    font-size: 11px;
    margin-right: 6px;
  }

  .step-tab.active .num { background: var(--accent); color: var(--bg); }

  main { padding: 24px 32px; }

  .panel { display: none; }
  .panel.active { display: block; }

  .section {
    margin-bottom: 28px;
  }

  .section h2 {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 4px;
    color: var(--text);
  }

  .section h2 .badge {
    display: inline-block;
    font-size: 10px;
    font-weight: 500;
    padding: 2px 8px;
    border-radius: 10px;
    margin-left: 8px;
    vertical-align: middle;
  }

  .section p.desc {
    color: var(--text-dim);
    font-size: 12px;
    margin-bottom: 12px;
  }

  .table-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
  }

  .table-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    max-width: 100%;
  }

  .table-card .card-header {
    padding: 8px 12px;
    background: var(--surface2);
    font-weight: 600;
    font-size: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .table-card .card-header .row-count {
    font-weight: 400;
    color: var(--text-dim);
    font-size: 11px;
  }

  .table-wrap {
    overflow-x: auto;
    max-height: 400px;
    overflow-y: auto;
  }

  table {
    border-collapse: collapse;
    font-size: 12px;
    width: 100%;
  }

  th {
    padding: 6px 10px;
    text-align: left;
    background: var(--surface2);
    color: var(--text-dim);
    font-weight: 500;
    position: sticky;
    top: 0;
    z-index: 1;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    white-space: nowrap;
  }

  td {
    padding: 5px 10px;
    border-top: 1px solid var(--border);
    white-space: nowrap;
  }

  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.null { color: var(--text-dim); font-style: italic; }

  th.sortable { cursor: pointer; user-select: none; }
  th.sortable:hover { color: var(--text); background: var(--border); }
  .sort-ind { color: var(--accent); font-size: 10px; margin-left: 2px; }

  .sort-reset {
    font-family: inherit;
    font-size: 11px;
    padding: 2px 8px;
    background: var(--surface);
    color: var(--text-dim);
    border: 1px solid var(--border);
    border-radius: 4px;
    cursor: pointer;
    margin-left: auto;
  }
  .sort-reset:hover { color: var(--text); border-color: var(--accent); }

  /* BFT column coloring */
  .col-alloc { color: var(--alloc); }
  .col-elim { color: var(--elim); }
  .col-reserve { color: var(--reserve); }
  .col-sumsum { color: var(--sumsum); }
  .col-home { color: var(--home); }
  .col-junction { color: var(--junction); }

  tr.correction-row td { background: var(--correction); }
  tr.reserve-row td { background: var(--reserve-row); }

  /* Strategy rules */
  .rules-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 16px;
  }

  .rule-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
  }

  .rule-card h3 {
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .rule-card h3 .pill {
    font-size: 10px;
    font-weight: 500;
    padding: 2px 8px;
    border-radius: 10px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .pill-alloc { background: rgba(91, 159, 91, 0.2); color: var(--alloc); }
  .pill-elim { background: rgba(196, 92, 92, 0.2); color: var(--elim); }
  .pill-reserve { background: rgba(122, 122, 140, 0.2); color: var(--reserve); }
  .pill-sumsum { background: rgba(196, 155, 60, 0.2); color: var(--sumsum); }
  .pill-home { background: rgba(108, 140, 255, 0.2); color: var(--home); }
  .pill-junction { background: rgba(139, 108, 196, 0.2); color: var(--junction); }

  .rule-card .source { color: var(--text-dim); font-size: 12px; margin-bottom: 10px; }

  .rule-path {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    font-size: 12px;
  }

  .rule-path .entity {
    background: var(--surface2);
    padding: 3px 10px;
    border-radius: 4px;
    font-weight: 500;
  }

  .rule-path .arrow {
    color: var(--text-dim);
    font-size: 14px;
  }

  .rule-path .strategy-label {
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 3px;
  }

  .rule-detail {
    margin-top: 10px;
    padding: 8px 10px;
    background: var(--surface2);
    border-radius: 4px;
    font-size: 11px;
    color: var(--text-dim);
    line-height: 1.6;
  }

  .rule-card .rule-detail + .rule-detail {
    margin-top: 6px;
    border-left: 2px solid var(--border);
  }

  /* Verification badges */
  .verify-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 12px;
    margin-top: 16px;
  }

  .verify-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px 14px;
    font-size: 12px;
  }

  .verify-card .label { color: var(--text-dim); margin-bottom: 4px; }

  .verify-card .values {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }

  .verify-card .match { color: var(--alloc); }
  .verify-card .mismatch { color: var(--elim); }

  /* Legend */
  .legend {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    padding: 10px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    margin-bottom: 20px;
    font-size: 11px;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .legend-swatch {
    width: 12px;
    height: 12px;
    border-radius: 3px;
  }

  /* Filter bar for BFT */
  .filter-bar {
    display: flex;
    gap: 12px;
    align-items: center;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }

  .filter-bar label {
    font-size: 12px;
    color: var(--text-dim);
  }

  .filter-bar select {
    font-family: inherit;
    font-size: 12px;
    padding: 4px 8px;
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 4px;
  }

  .filter-bar select:focus {
    outline: 1px solid var(--accent);
  }

  /* Metric toggle buttons */
  .metric-toggles {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }

  .metric-toggle {
    font-family: inherit;
    font-size: 12px;
    padding: 6px 12px;
    background: var(--surface);
    color: var(--text-dim);
    border: 1px solid var(--border);
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.15s;
    opacity: 0.45;
  }

  .metric-toggle:hover { opacity: 0.7; }

  .metric-toggle.on {
    opacity: 1;
    color: var(--text);
    border-color: var(--accent);
    background: var(--surface2);
  }

  .metric-toggle .pill {
    display: inline-block;
    font-size: 9px;
    font-weight: 600;
    padding: 1px 6px;
    border-radius: 8px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-right: 4px;
    vertical-align: middle;
  }
</style>
</head>

// ── HELPERS ──────────────────────────────────────────────────
function fmt(v, col) {
  if (v === null || v === undefined) return { text: 'NULL', cls: 'null' };
  if (typeof v === 'number') {
    if (col && (col.includes('cost') || col.includes('fee') || col.includes('fine') || col.includes('amount') || col.includes('paid'))) {
      return { text: v.toFixed(2), cls: 'num' };
    }
    if (typeof v === 'number' && !Number.isInteger(v)) {
      return { text: v.toFixed(4), cls: 'num' };
    }
    return { text: String(v), cls: 'num' };
  }
  return { text: String(v), cls: '' };
}

function makeTable(tbl, opts = {}) {
  const { colClass, rowClass, maxRows, sortable } = opts;
  const wrap = document.createElement('div');
  wrap.className = 'table-wrap';
  const table = document.createElement('table');

  // Sort state: array of { col, dir } — first entry is primary
  // Clicking a new column pushes it to front; clicking same column flips its dir
  let sortKeys = [];

  function sortedRows(rows) {
    if (sortKeys.length === 0) return rows;
    return [...rows].sort((a, b) => {
      for (const { col, dir } of sortKeys) {
        const av = a[col], bv = b[col];
        // nulls always last
        if (av === null && bv !== null) return 1;
        if (av !== null && bv === null) return -1;
        if (av === null && bv === null) continue;
        let cmp = 0;
        if (typeof av === 'number' && typeof bv === 'number') {
          cmp = av - bv;
        } else {
          cmp = String(av).localeCompare(String(bv));
        }
        if (cmp !== 0) return dir === 'asc' ? cmp : -cmp;
      }
      return 0;
    });
  }

  function renderBody(rows) {
    tbody.innerHTML = '';
    const sorted = sortedRows(rows);
    const display = maxRows ? sorted.slice(0, maxRows) : sorted;
    for (const row of display) {
      const tr = document.createElement('tr');
      if (rowClass) {
        const cls = rowClass(row);
        if (cls) tr.classList.add(cls);
      }
      for (const col of tbl.columns) {
        const td = document.createElement('td');
        const f = fmt(row[col], col);
        td.textContent = f.text;
        if (f.cls) td.classList.add(f.cls);
        if (colClass && colClass[col]) td.classList.add(colClass[col]);
        tr.appendChild(td);
      }
      tbody.appendChild(tr);
    }
    if (maxRows && rows.length > maxRows) {
      const tr = document.createElement('tr');
      const td = document.createElement('td');
      td.colSpan = tbl.columns.length;
      td.textContent = `... ${rows.length - maxRows} more rows`;
      td.className = 'null';
      td.style.textAlign = 'center';
      tr.appendChild(td);
      tbody.appendChild(tr);
    }
  }

  function updateHeaders() {
    for (const th of hrow.children) {
      const col = th.dataset.col;
      const idx = sortKeys.findIndex(k => k.col === col);
      // Clear old indicators
      const old = th.querySelector('.sort-ind');
      if (old) old.remove();
      if (idx >= 0) {
        const ind = document.createElement('span');
        ind.className = 'sort-ind';
        const arrow = sortKeys[idx].dir === 'asc' ? '\u25B2' : '\u25BC';
        const rank = sortKeys.length > 1 ? `${idx + 1}` : '';
        ind.textContent = ` ${arrow}${rank}`;
        th.appendChild(ind);
      }
    }
  }

  // Header
  const thead = document.createElement('thead');
  const hrow = document.createElement('tr');
  for (const col of tbl.columns) {
    const th = document.createElement('th');
    th.textContent = col;
    th.dataset.col = col;
    if (colClass && colClass[col]) th.classList.add(colClass[col]);
    if (sortable) {
      th.classList.add('sortable');
      th.addEventListener('click', () => {
        const existing = sortKeys.findIndex(k => k.col === col);
        if (existing === 0) {
          // Already primary — flip direction
          sortKeys[0].dir = sortKeys[0].dir === 'asc' ? 'desc' : 'asc';
        } else {
          // Remove from old position if present, push to front
          if (existing > 0) sortKeys.splice(existing, 1);
          sortKeys.unshift({ col, dir: 'asc' });
          // Keep max 3 sort keys
          if (sortKeys.length > 3) sortKeys.pop();
        }
        updateHeaders();
        renderBody(tbl.rows);
      });
    }
    hrow.appendChild(th);
  }
  thead.appendChild(hrow);
  table.appendChild(thead);

  // Body
  const tbody = document.createElement('tbody');
  renderBody(tbl.rows);
  table.appendChild(tbody);

  wrap.appendChild(table);
  wrap.resetSort = () => { sortKeys = []; updateHeaders(); renderBody(tbl.rows); };
  return wrap;
}

function card(title, rowCount, content) {
  const div = document.createElement('div');
  div.className = 'table-card';
  div.innerHTML = `<div class="card-header"><span>${title}</span><span class="row-count">${rowCount} rows</span></div>`;
  div.appendChild(content);
  return div;
}

  ];

  // Legend
  const legend = document.createElement('div');
  legend.className = 'legend';
  legend.innerHTML = `
    <div class="legend-item"><div class="legend-swatch" style="background:var(--alloc)"></div> Allocation</div>
    <div class="legend-item"><div class="legend-swatch" style="background:var(--elim)"></div> Elimination</div>
    <div class="legend-item"><div class="legend-swatch" style="background:var(--reserve)"></div> Reserve</div>
    <div class="legend-item"><div class="legend-swatch" style="background:var(--sumsum)"></div> Sum/Sum</div>
    <div class="legend-item"><div class="legend-swatch" style="background:var(--junction)"></div> Junction</div>
  `;
  panel.appendChild(legend);

  // Table picker
  const pickerBar = document.createElement('div');
  pickerBar.className = 'filter-bar';
  const lbl1 = document.createElement('label');
  lbl1.textContent = 'Table:';
  pickerBar.appendChild(lbl1);

  const bftSelect = document.createElement('select');
  bftSelect.id = 'bft-select';
  const opt1 = document.createElement('option');
  opt1.value = 'patron_book_report';
  opt1.textContent = 'patron_book_report (Patron x Book)';
  bftSelect.appendChild(opt1);
  const opt2 = document.createElement('option');
  opt2.value = 'patron_author_report';
  opt2.textContent = 'patron_author_report (Patron x Book x Author)';
  bftSelect.appendChild(opt2);
  pickerBar.appendChild(bftSelect);
  panel.appendChild(pickerBar);

  // Grain description
  const grainDesc = document.createElement('div');
  grainDesc.className = 'grain-desc';
  panel.appendChild(grainDesc);

  // Dimension toggles
  const dimBar = document.createElement('div');
  dimBar.className = 'metric-toggles';
  panel.appendChild(dimBar);

  // BFT table container
  const bftContainer = document.createElement('div');
  bftContainer.id = 'bft-table';
  panel.appendChild(bftContainer);

  // Verification
  const verifySection = document.createElement('div');
  verifySection.id = 'bft-verify';
  verifySection.className = 'section';
  verifySection.style.marginTop = '20px';
  panel.appendChild(verifySection);

  let activeDims = new Set();

  function buildDimToggles() {
    dimBar.innerHTML = '';
    const dims = tableDims[bftSelect.value];
    activeDims = new Set(dims.map(d => d.key));

    for (const dim of dims) {
      const btn = document.createElement('button');
      btn.className = 'metric-toggle on';
      btn.dataset.dim = dim.key;
      btn.textContent = dim.label;
      btn.addEventListener('click', () => {
        if (activeDims.has(dim.key)) activeDims.delete(dim.key);
        else activeDims.add(dim.key);
        btn.classList.toggle('on');
        render();
      });
      dimBar.appendChild(btn);
    }
  }

  function aggregate(tbl, dims, selectedDims) {
    const groupDimDefs = dims.filter(d => selectedDims.has(d.key));
    const allRows = tbl.rows;

    // If all dims selected, no aggregation needed
    if (groupDimDefs.length === dims.length) {
      // Build columns: dim cols + metric cols (skip weight col)
      const cols = [];
      for (const d of dims) { cols.push(d.idCol, d.labelCol); }
      const metricCols = tbl.columns.filter(c => metricColors[c]);
      cols.push(...metricCols);
      return { columns: cols, rows: allRows };
    }

    // Group by selected dimensions
    const groups = new Map();
    for (const row of allRows) {
      const keyParts = groupDimDefs.map(d => row[d.idCol]);
      const key = keyParts.join('|');
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(row);
    }

    // Aggregate
    const cols = [];
    for (const d of groupDimDefs) { cols.push(d.idCol, d.labelCol); }
    const metricCols = tbl.columns.filter(c => metricColors[c]);
    cols.push(...metricCols);

    const aggRows = [];
    for (const [, groupRows] of groups) {
      const out = {};
      for (const d of groupDimDefs) {
        out[d.idCol] = groupRows[0][d.idCol];
        out[d.labelCol] = groupRows[0][d.labelCol];
      }
      for (const col of metricCols) {
        if (sumSumMetrics[col]) {
          // Weighted average: SUM(val * weight) / SUM(weight)
          const weightCol = sumSumMetrics[col];
          let sumVW = 0, sumW = 0;
          for (const r of groupRows) {
            const w = Number(r[weightCol]) || 0;
            sumVW += (Number(r[col]) || 0) * w;
            sumW += w;
          }
          out[col] = sumW > 0 ? sumVW / sumW : 0;
        } else {
          out[col] = groupRows.reduce((s, r) => s + (Number(r[col]) || 0), 0);
        }
      }
      aggRows.push(out);
    }

    return { columns: cols, rows: aggRows };
  }

  function render() {
    const tableName = bftSelect.value;
    const tbl = DATA[tableName];
    const dims = tableDims[tableName];
    const selectedDims = activeDims;

    // Grain description
    const dimNames = dims.filter(d => selectedDims.has(d.key)).map(d => d.label);
    const grainLabel = dimNames.length === 0
      ? 'Grand Total (no dimensions — just SUM everything)'
      : dimNames.join(' x ');
    grainDesc.innerHTML = `<div style="margin-bottom:12px; font-size:13px;">
      Grain: <strong>${grainLabel}</strong>
      <span style="color:var(--text-dim); margin-left:8px;">
        ${dimNames.length < dims.length
          ? '— aggregated by SUM (and weighted avg for Sum/Sum metrics)'
          : '— full detail, every row from the BFT'}
      </span>
    </div>`;

    const agg = aggregate(tbl, dims, selectedDims);

    const colClass = {};
    for (const [col, cls] of Object.entries(metricColors)) colClass[col] = cls;

    bftContainer.innerHTML = '';
    const tableEl = makeTable(agg, { colClass, sortable: true });
    const cardEl = card(`${grainLabel}`, agg.rows.length, tableEl);
    // Add reset sort button to card header
    const resetBtn = document.createElement('button');
    resetBtn.className = 'sort-reset';
    resetBtn.textContent = 'Reset sort';
    resetBtn.addEventListener('click', () => tableEl.resetSort());
    cardEl.querySelector('.card-header').appendChild(resetBtn);
    bftContainer.appendChild(cardEl);

    // Verification — SUM of additive metrics should match source at every grain
    const metricCols = tbl.columns.filter(c => metricColors[c]);
    verifySection.innerHTML = '<h2>SUM Verification</h2><p class="desc">Additive metrics must SUM to the source total at every grain level. That\'s what makes a BFT SUM-safe.</p>';
    const vg = document.createElement('div');
    vg.className = 'verify-grid';

    for (const chk of sourceChecks) {
      if (!metricCols.includes(chk.col)) continue;
      const bftSum = agg.rows.reduce((s, r) => s + (Number(r[chk.col]) || 0), 0);
      const match = Math.abs(bftSum - chk.source) < 0.01;
      const vc = document.createElement('div');
      vc.className = 'verify-card';
      vc.innerHTML = `
        <div class="label">SUM(${chk.col})</div>
        <div class="values">
          <span>Source: <strong>${chk.source.toFixed(2)}</strong></span>
          <span>BFT: <strong>${bftSum.toFixed(2)}</strong></span>
          <span class="${match ? 'match' : 'mismatch'}">${match ? 'PASS' : 'FAIL'}</span>
        </div>`;
      vg.appendChild(vc);
    }
    verifySection.appendChild(vg);

    // Sum/Sum note
    if (metricCols.includes('avg_fine_per_checkout')) {
      const note = document.createElement('div');
      note.className = 'rule-detail';
      note.style.marginTop = '12px';
      const allRows = agg.rows;
      const weightCol = 'avg_fine_per_checkout_weight';
      let sumVW = 0, sumW = 0;
      for (const r of tbl.rows) {
        const w = r[weightCol] || 0;
        sumVW += (r.avg_fine_per_checkout || 0) * w;
        sumW += w;
      }
      const weightedAvg = sumW > 0 ? sumVW / sumW : 0;
      note.innerHTML = `<strong>avg_fine_per_checkout</strong> is a Sum/Sum metric — do not SUM it directly. ` +
        `Weighted average across all rows: SUM(value x weight) / SUM(weight) = <strong>${weightedAvg.toFixed(4)}</strong>`;
      verifySection.appendChild(note);
    }
  }

  bftSelect.addEventListener('change', () => {
    buildDimToggles();
    render();
  });
  buildDimToggles();
  render();
})();
</script>
</body>
</html>
